services:
  - type: web
    name: e-gov-connect
    env: node
    region: singapore
    plan: free
    buildCommand: npm run setup && npm run build --prefix frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://demo:demo123@cluster0.mongodb.net/govconnect?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
