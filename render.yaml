services:
  # Backend Node.js / Express Web Service
  - type: web
    name: e-gram-panchayat-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: NODE_ENV
        value: production

  # Frontend React Static Site
  - type: web
    name: e-gram-panchayat-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: REACT_APP_API_URL
        sync: false
